<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="简洁的个人待办清单，安排任务、分类标签与循环计划。">
  <title>日序 · 待办、课程与饮食</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <script src="course-center.js" defer></script>
  <script src="course-import.js" defer></script>
  <script src="courses.js" defer></script>
  <script src="food.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header"><div><span class="eyebrow">一点计划，从容一天</span><h1><span class="logo" aria-hidden="true">✓</span>日序 <span>待办清单</span></h1></div><p id="today"></p></header>
    <nav class="module-nav" aria-label="功能模块"><button type="button" id="show-tasks" aria-pressed="true" aria-controls="todo-module">待办清单</button><button type="button" id="show-courses" aria-pressed="false" aria-controls="course-module">课程</button><button type="button" id="show-food" aria-pressed="false" aria-controls="food-module">饮食打卡</button></nav>
    <div class="layout" id="todo-module">
      <section class="panel editor" aria-labelledby="form-heading">
        <h2 id="form-heading">添加待办</h2><p class="muted">把要做的事，放在这里。</p>
        <form id="task-form">
          <label for="title">任务名称 <span class="required">*</span></label>
          <input id="title" name="title" placeholder="接下来要做什么？" maxlength="120" required>
          <label for="tags">标签</label><input id="tags" name="tags" placeholder="例如：课程，生活" maxlength="200"><small>用中文或英文逗号分隔多个标签</small>
          <label for="date">任务日期</label><input id="date" name="date" type="date">
          <label for="deadline">截止时间</label><input id="deadline" name="deadline" type="datetime-local">
          <div class="field-row"><div><label for="repeat">循环</label><select id="repeat" name="repeat"><option value="none">不循环</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="custom">自定义</option></select></div><div><label for="status">状态</label><select id="status" name="status"><option value="todo">未完成</option><option value="doing">进行中</option><option value="done">已完成</option></select></div></div>
          <div id="custom-repeat" class="field-row" hidden><div><label for="repeat-interval">每隔</label><input id="repeat-interval" name="repeatInterval" type="number" min="1" max="999" step="1" value="1" disabled></div><div><label for="repeat-unit">周期单位</label><select id="repeat-unit" name="repeatUnit" disabled><option value="days">天</option><option value="weeks">周</option><option value="months">月</option></select></div></div>
          <small class="repeat-note">循环任务完成后自动生成下一次待办。未填任务日期时从今天起算。</small>
          <div class="form-actions"><button class="primary" id="save" type="submit">＋ 添加待办</button><button id="cancel" type="button" hidden>取消编辑</button></div>
        </form>
      </section>
      <section class="workspace" aria-labelledby="list-heading">
        <div class="list-header"><h2 id="list-heading">我的待办</h2><span id="summary" class="muted"></span></div>
        <div class="filters panel"><div id="status-filters" class="tabs" aria-label="按状态筛选"><button type="button" data-status="all" aria-pressed="true">全部</button><button type="button" data-status="todo" aria-pressed="false">未完成</button><button type="button" data-status="doing" aria-pressed="false">进行中</button><button type="button" data-status="done" aria-pressed="false">已完成</button></div><div class="tag-filter"><label for="tag-filter">标签</label><select id="tag-filter"><option value="">全部标签</option></select></div></div>
        <label class="toggle-label" for="hide-completed"><input type="checkbox" role="switch" id="hide-completed">隐藏已完成</label>
        <p id="message" role="status" aria-live="polite"></p>
        <div id="tasks" class="tasks"></div>
        <div id="empty" class="empty panel"><span aria-hidden="true">✓</span><h3>从一件小事开始</h3><p>添加你的第一条待办，给今天一点方向。</p></div>
      </section>
    </div>
    <section id="course-module" hidden aria-labelledby="course-heading">
      <div class="list-header"><div><h2 id="course-heading">课程</h2><p class="muted course-intro">按自己的时间，安排每一周。</p></div><button type="button" id="add-course" class="primary">＋ 添加课程</button></div>
      <div class="tabs center-nav"><button type="button" id="course-tab-table" aria-pressed="true">课程表</button><button type="button" id="course-tab-all" aria-pressed="false">所有课程</button></div>
      <div id="course-recent" class="panel center-recent"></div><div id="course-table-view"><div class="panel course-toolbar"><div class="week-navigation"><button type="button" id="prev-week" aria-label="上一周">←</button><strong id="week-label" aria-live="polite"></strong><button type="button" id="next-week" aria-label="下一周">→</button><button type="button" id="this-week">本周</button></div><div class="semester-field"><label for="semester-start">第一周周一</label><input type="date" id="semester-start" aria-describedby="semester-help"></div><small id="semester-help">设置学期第一周的周一，单周 / 双周按此起算；未设置时展示所有课程。</small></div>
      <p id="course-message" role="status" aria-live="polite"></p>
      <p id="course-summary" class="muted"></p>
      <div id="week-grid" class="week-grid"></div></div>
      <div id="course-all" class="center-grid" hidden></div><div id="course-detail" hidden></div><p id="center-message" role="status"></p>
    </section>
    <dialog id="course-dialog" aria-labelledby="course-form-heading">
      <form id="course-form">
        <div class="list-header"><h2 id="course-form-heading">添加课程</h2><button type="button" id="close-course" aria-label="关闭课程编辑">×</button></div>
        <label for="course-name">课程名称 <span class="required">*</span></label><input id="course-name" name="name" required maxlength="120" placeholder="例如：软件开发技术与实践">
        <div class="field-row"><div><label for="course-day">星期</label><select id="course-day" name="day"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></div><div><label for="course-repeat">重复方式</label><select id="course-repeat" name="repeat"><option value="every">每周</option><option value="odd">单周</option><option value="even">双周</option></select></div></div>
        <div class="field-row"><div><label for="course-start">开始时间 <span class="required">*</span></label><input id="course-start" name="start" type="time" required></div><div><label for="course-end">结束时间 <span class="required">*</span></label><input id="course-end" name="end" type="time" required></div></div>
        <label for="course-location">地点</label><input id="course-location" name="location" maxlength="160" placeholder="例如：理教 203">
        <label for="course-teacher">教师</label><input id="course-teacher" name="teacher" maxlength="120"><label for="course-description">课程简介</label><textarea id="course-description" name="description" maxlength="3000" rows="3"></textarea>
        <label for="course-notes">备注</label><textarea id="course-notes" name="notes" rows="3" maxlength="1000" placeholder="教材、老师或其他提醒"></textarea>
        <p id="course-form-message" role="alert"></p>
        <div class="form-actions"><button type="submit" class="primary">保存课程</button><button type="button" id="cancel-course">取消</button></div>
      </form>
    </dialog>
    <section id="food-module" hidden aria-labelledby="food-heading">
      <div class="list-header"><h2 id="food-heading">饮食打卡</h2><button id="add-food" type="button" class="primary">＋ 记录饮食</button></div>
      <section class="panel food-map" aria-labelledby="heatmap-heading">
        <div class="list-header"><h2 id="heatmap-heading">热量图谱</h2><div class="food-year"><button id="food-prev-year" type="button" aria-label="上一年">←</button><strong id="food-year-label"></strong><button id="food-next-year" type="button" aria-label="下一年">→</button></div></div>
        <p class="muted">颜色按当天热量等级累加：低 1 分、中 2 分、高 3 分。点击日期查看记录。</p>
        <div class="heat-legend" aria-label="颜色等级：无记录、1分、2至3分、4至6分、7分及以上">浅 <i class="heat-0"></i><i class="heat-1"></i><i class="heat-2"></i><i class="heat-3"></i><i class="heat-4"></i> 深</div>
        <div class="tabs food-view-tabs" aria-label="热量图谱视图"><button id="food-view-year" type="button" aria-pressed="true">年</button><button id="food-view-month" type="button" aria-pressed="false">月</button><button id="food-view-week" type="button" aria-pressed="false">周</button><button id="food-view-day" type="button" aria-pressed="false">日</button></div>
        <div id="food-heatmap" class="food-heatmap"></div>
      </section>
      <div class="food-day-bar"><label for="food-selected-date">查看日期</label><input id="food-selected-date" type="date" min="1900-01-01" max="9998-12-31"><button id="food-today" type="button">今天</button></div>
      <p id="food-message" role="status" aria-live="polite"></p><div id="food-day-details" hidden><p id="food-summary" class="muted" tabindex="-1"></p>
      <div id="food-records" class="tasks"></div><p id="food-empty" class="panel food-empty">这一天还没有饮食记录。点击“记录饮食”添加。</p></div>
    </section>
    <dialog id="food-dialog" aria-labelledby="food-form-heading"><form id="food-form">
      <div class="list-header"><h2 id="food-form-heading">记录饮食</h2><button id="close-food" type="button" aria-label="关闭饮食编辑">×</button></div>
      <label for="food-name">食物或饮品名称 *</label><input id="food-name" name="name" required maxlength="120" placeholder="例如：一杯奶茶">
      <label for="food-date">日期 *</label><input id="food-date" name="date" type="date" min="1900-01-01" max="9998-12-31" required>
      <div class="field-row"><div><label for="food-type">类型</label><select id="food-type" name="type"><option>奶茶</option><option>甜点</option><option>炸物</option><option>夜宵</option><option>零食</option><option>其他</option></select></div><div><label for="food-level">热量等级</label><select id="food-level" name="level"><option value="1">低</option><option value="2" selected>中</option><option value="3">高</option></select></div></div>
      <label for="food-kcal">估算热量 kcal（可选）</label><input id="food-kcal" name="kcal" type="number" min="0" max="100000" step="0.1" placeholder="不确定可以留空">
      <label for="food-notes">备注（可选）</label><textarea id="food-notes" name="notes" rows="3" maxlength="1000"></textarea>
      <p id="food-form-message" role="alert"></p><div class="form-actions"><button type="submit" class="primary">保存记录</button><button id="cancel-food" type="button">取消</button></div>
    </form></dialog>
    <dialog id="center-dialog" aria-labelledby="center-form-heading"><form id="center-form"><h2 id="center-form-heading"></h2><div id="center-fields"></div><p id="center-form-error" role="alert"></p><div class="form-actions"><button type="submit" class="primary">保存</button><button type="button" id="center-cancel">取消</button></div></form></dialog>
    <footer>日序 · 数据保存在当前浏览器中</footer>
  </main>
</body>
</html>
